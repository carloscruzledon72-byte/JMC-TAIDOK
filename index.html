<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JMC TAIDOK - Prueba</title>
</head>

<body>

  <h1>JMC TAIDOK</h1>

  <button id="btnLeer">📷 Leer etiqueta difícil</button>
<input id="foto" type="file" accept="image/*" capture="environment" style="display:none">
  <p id="estado">Listo para probar</p>

  <script>
    const boton = document.getElementById("btnLeer");
    const estado = document.getElementById("estado");

    boton.addEventListener("click", function () {
  document.getElementById("foto").click();
});
    const foto = document.getElementById("foto");

foto.addEventListener("change", function () {
  if (foto.files && foto.files[0]) {
    estado.textContent = "FOTO RECIBIDA";
    alert("FOTO RECIBIDA");
  }
});
  </script>

</body>
</html>
